services:
  web:
    build: .
    container_name: core-banking-app
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=staging
      - APP_VERSION=1.0.0
      - DB_PATH=/data/banking.db
    volumes:
      - banking-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  banking-data:
